[tool_upgrades]
max_level = 5
# Gold to reach each level: "level" = cost
costs = { "2" = 40, "3" = 80, "4" = 120, "5" = 160 }
# Lifetime earnings needed before the shop offers a level (levels not listed: always)
unlock_at = { "4" = 2500, "5" = 5000 }

# Effective digging tier of a tool = its tier + (level - 1) // 2.
# A gem with min_tier N is only found with an effective tier of at least N.

[bag]
# Items (gems and loot) the player can carry, per bag level
capacities = [15, 25, 40, 60]
costs = [0, 120, 300, 600]
unlock_at = [0, 0, 2500, 5000]

[lantern]
# Seconds of light at a drain rate of 1/s, per lantern level
capacities = [240, 420, 660]
costs = [0, 150, 400]
unlock_at = [0, 0, 2500]
# Fuel burned per second of game time in each biome (refills for free in town)
drain = { meadow = 0.5, hillside = 1.0, river = 1.5, cave = 2.5 }
# Light radius in tiles goes from min_radius (empty) to the full fog radius
min_radius = 2

[armor]
# Damage an enemy hit loses per armor level (a hit always does at least 1)
reductions = [0, 1, 2, 3]
costs = [0, 110, 260, 520]
unlock_at = [0, 0, 1500, 4000]

[boots]
# Time between steps per boots level, as a share of MOVE_COOLDOWN (lower is faster)
step_multipliers = [1.0, 0.85, 0.7]
costs = [0, 130, 340]
unlock_at = [0, 0, 2000]

[dowsing]
# Reach in tiles of the dowsing rod's hot/cold hints toward ground gems, per level
radii = [0, 6, 10]
costs = [0, 180, 420]
unlock_at = [0, 0, 2500]

# Supplies: consumables used with the Item action (the most needed one is used)
[supplies.bandage]
name = "Bandage"
cost = 25
heal = 8
desc = "Heals 8 HP"

[supplies.lamp_oil]
name = "Lamp Oil"
cost = 30
fuel_share = 0.5
desc = "Refills half of your lantern, anywhere"

# Permanent perks bought with reputation between runs (see game/profile.py).
# Each level adds `per_level`; `costs` lists the reputation price of each level.
[perks.start_gold]
name = "Savings"
desc = "Start runs with more gold"
per_level = 50
costs = [3, 6, 10]

[perks.max_hp]
name = "Sturdy"
desc = "More maximum HP"
per_level = 4
costs = [3, 6, 10]

[perks.bag_bonus]
name = "Deep Pockets"
desc = "Carry more items"
per_level = 5
costs = [4, 8, 12]

[perks.lantern_bonus]
name = "Better Wick"
desc = "Lantern lasts longer (+20% per level)"
per_level = 0.2
costs = [3, 6, 10]

[reputation]
# Reputation earned when a run ends: lifetime earnings // divisor
win_divisor = 500
hardcore_death_divisor = 1000
daily_divisor = 1000

# Peaceful animals (game/critters.py): they never attack and flee when the player
# comes within flee_range (whole herds bolt together). habitat is "land" or "water";
# active is "day", "night" or "any"; herd = [min, max] animals spawned together;
# wander_seconds / flee_seconds = time between steps (the player steps every 0.15 s).
# Optional: rain = "avoids" or "likes" (likes doubles its odds while it rains),
# weight = how common it is among the species that fit (default 1), glow = true to
# stay bright at night.
[[critters]]
